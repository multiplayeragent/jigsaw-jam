<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jigsaw Jam</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #3a2a22; }

          background: #1e1410d9; text-align: center; font-size: 14px; font-weight: 700; color: #ffd98a; text-shadow: none; transition: opacity .8s; }
  #toast { top: 18%; left: 16px; right: 16px; text-align: center; font-size: 20px; font-weight: 800; color: #ffd98a; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }

  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb36b; text-align: left; }

  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffb36b; color: #2b1606; font: 800 17px system-ui, sans-serif; cursor: pointer; }
</style>

<body>
<canvas id="game"></canvas>
<div class="hud" id="stats"></div>
<div class="hud" id="who"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2>Puzzle complete!</h2>
  <div id="doneText"></div>
  <h3>Fastest puzzles</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">New puzzle</button>
</div></div>
<script>
/* ═══ JIGSAW JAM · a Multiplayer Agent starter ══════════════════════════════════════════
 * A freshly painted jigsaw, built together. Co-op, 1–8 players; helper bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ pieces, table size, snap distance, bots, timers
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   PICTURE ....... paints the round's picture from a seed (hills, city or reef)
 *   PIECES ........ cuts it into jigsaw pieces (tabs from the same seed)
 *   TABLE (HOST) .. who holds which piece, drops, snapping, the finish, new puzzles
 *   BOTS .......... helpers that pick a piece, carry it home and sometimes need a second try
 *   ME ............ grabbing, carrying and dropping (shown at once, then confirmed)
 *   DRAW .......... camera, table, frame, pieces, everyone's cursors
 *   HUD & CARD .... progress, who placed what, the finished card, leaderboard
 *   INPUT ......... drag a piece, drag the table to pan, wheel/pinch to zoom
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `cur` (one JSON field: cursor, the piece in hand and
 *     where it is) up to 12 times a second, `hb` (heartbeat) once a second, `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields: `game` (round id,
 *     version `v`, seed, phase, timers, who placed how many), `pieces` (every piece's spot,
 *     stacking order and whether it's placed), `held` (piece → who holds it) and `bots`.
 *     A new host adopts all of it from state.
 *   - The picture and the piece shapes come from `seed` (a seeded PRNG), so nothing but
 *     the seed is in state for them.
 *   - Everyone else sends intents: "grab" {i}, "drop" {i, x, y}, "again" {}. A piece you
 *     hold is locked to you: the host refuses anyone else's grab. Your own moves show at
 *     once; if someone grabbed the piece first, it goes back.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-jigsaw": time from the first piece to the last, stored as
 *     3600000 - ms (boards keep the highest score), shown on the finished card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  cols: 6, rows: 6,     // pieces across and down (the picture is cols × rows piece-units)
  margin: { x: 2.8, y: 3.2 }, // table around the frame, in piece-units (loose pieces start here)
  snap: 0.3,            // a dropped piece this close to its home (piece-units) snaps in
  seats: 3,             // bots fill the room up to this many puzzlers
  botThinkMs: [3000, 6000], // a bot's pause between pieces (min, max)
  botMiss: 0.35,        // chance a bot drops a piece a little off and has to come back to it
  doneFor: 25000,       // ms the finished card shows before a new puzzle
  piecePx: 110,         // each piece's texture size (sharper when zoomed in, more memory)
  board: "fastest-jigsaw",
};
const BOT_NAMES = ["Pip", "Tess", "Bo", "Mika", "Juno", "Ollie", "Wren"];
const COLORS = ["#ff5d73", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#3de0d0", "#ff6fb5"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'jigsaw-jam',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);

  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);

}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── PICTURE ─────────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/** The round's picture, painted from its seed: rolling hills, a city at dusk, or a reef. */

    const sx = r(0.15, 0.85) * w, sy = r(0.12, 0.3) * h, glow = g.createRadialGradient(sx, sy, 0, sx, sy, w * 0.3);
    glow.addColorStop(0, "#fff7d1ee"); glow.addColorStop(1, "#fff7d100"); g.fillStyle = glow; g.fillRect(0, 0, w, h); blob(sx, sy, w * 0.07, "#fff3c0");
    for (let k = 0; k < 5; k++) { const cx = r(0, w), cy = r(0.05, 0.35) * h, s = r(0.03, 0.06) * w; for (let j = 0; j < 5; j++) blob(cx + (j - 2) * s * 0.8, cy + Math.sin(j * 2) * s * 0.3, s * r(0.7, 1.1), "#ffffffd9"); }

      for (let x = 0; x <= w; x += 4) g.lineTo(x, yAt(x)); g.lineTo(w, h); g.fill();
      if (layer >= 1) for (let k = 0; k < 4 + layer * 3; k++) { const x = r(0, w), y = yAt(x) + r(2, 30), s = r(10, 22) * (0.6 + layer * 0.25);
        g.fillStyle = hsl(hue + 120 + r(-20, 20), 45, 28 - layer * 3); g.beginPath(); g.moveTo(x, y - s * 1.8); g.lineTo(x - s * 0.6, y); g.lineTo(x + s * 0.6, y); g.fill(); g.fillStyle = "#5a3b22"; g.fillRect(x - 2, y, 4, s * 0.4); }
      if (layer === 2) { const x = r(0.2, 0.8) * w, y = yAt(x) + 10; g.fillStyle = hsl(hue + 20, 60, 85); g.fillRect(x - 22, y - 30, 44, 30); g.fillStyle = hsl(hue, 60, 45); g.beginPath(); g.moveTo(x - 28, y - 30); g.lineTo(x, y - 54); g.lineTo(x + 28, y - 30); g.fill(); g.fillStyle = "#4a3020"; g.fillRect(x - 6, y - 16, 12, 16); }
    }
    for (let k = 0; k < 70; k++) blob(r(0, w), r(0.85, 1) * h, r(2, 5), hsl(hue + r(0, 360), 85, 70));

    g.fillStyle = grad(0, h * 0.7, [hsl(hue + 250, 50, 18), hsl(hue + 300, 55, 40), hsl(hue + 20, 85, 65)]); g.fillRect(0, 0, w, h);
    for (let k = 0; k < 90; k++) blob(r(0, w), r(0, 0.45) * h, r(0.6, 1.6), "#ffffffcc");
    const mx = r(0.15, 0.85) * w, my = r(0.12, 0.3) * h; blob(mx, my, w * 0.09, hsl(hue + 40, 90, 85)); blob(mx + w * 0.03, my - w * 0.02, w * 0.075, hsl(hue + 30, 80, 75, 0.35));
    const water = h * 0.72;
    for (const [far, n] of [[1, 14], [0, 10]]) {
      let x = -10;
      while (x < w) {
        const bw = r(30, 70) * (far ? 0.8 : 1.1), bh = r(0.15, far ? 0.45 : 0.38) * h, top = water - bh;
        g.fillStyle = far ? hsl(hue + 260, 30, 30) : hsl(hue + 250, 35, 16); g.fillRect(x, top, bw, bh);
        if (!far && R() < 0.4) { g.fillRect(x + bw * 0.4, top - 20, 3, 20); blob(x + bw * 0.4 + 1.5, top - 20, 2.5, "#ff5a5a"); }
        for (let wy = top + 8; wy < water - 6; wy += 11) for (let wx = x + 5; wx < x + bw - 6; wx += 9) if (R() < (far ? 0.35 : 0.5)) { g.fillStyle = hsl(r(35, 55), 95, r(60, 80), far ? 0.7 : 1); g.fillRect(wx, wy, 4, 5); }

    for (let k = 0; k < 120; k++) { const x = r(0, w), y = r(water + 4, h); g.fillStyle = hsl(r(30, 60), 90, 70, r(0.2, 0.6)); g.fillRect(x, y, r(6, 26), 2); }
  } else { // a coral reef
    g.fillStyle = grad(0, h, [hsl(185 + hue * 0.1, 70, 60), hsl(205, 65, 38), hsl(225, 60, 22)]); g.fillRect(0, 0, w, h);
    for (let k = 0; k < 6; k++) { const x = r(0, w); g.fillStyle = "#ffffff14"; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + r(40, 90), 0); g.lineTo(x + r(120, 260), h); g.lineTo(x + r(60, 120), h); g.fill(); }
    g.fillStyle = hsl(40, 55, 70); g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 6) g.lineTo(x, h * 0.86 + Math.sin(x / 40 + hue) * 8); g.lineTo(w, h); g.fill();
    for (let k = 0; k < 9; k++) { // corals: branching strokes
      const x0 = r(0, w), col = hsl(hue + r(-40, 40) + (k % 2) * 180, 75, 62); g.strokeStyle = col; g.lineCap = "round";

      const x = r(0.05, 0.95) * w, y = r(0.1, 0.75) * h, s = r(14, 30), dir = R() < 0.5 ? 1 : -1, col = hsl(hue + r(0, 360), 85, 60);

      g.beginPath(); g.moveTo(x - dir * s * 0.8, y); g.lineTo(x - dir * s * 1.5, y - s * 0.5); g.lineTo(x - dir * s * 1.5, y + s * 0.5); g.fill();

// ── PIECES ──────────────────────────────────────────────────────────────────────────
const TAB = [[0.35, 0], [0.40, 0, 0.43, 0.06, 0.39, 0.12], [0.33, 0.22, 0.40, 0.30, 0.50, 0.30], [0.60, 0.30, 0.67, 0.22, 0.61, 0.12], [0.57, 0.06, 0.60, 0, 0.65, 0]];
/** Trace one edge from (ax, ay) to (bx, by): straight on the border, else a tab out (s = 1) or a hole (s = -1). */

/** The outline of piece (c, r) in piece-units (0..1 is its square; tabs stick out up to 0.3). */

const art = { key: "", picture: null, tiles: [], cut: null };
/** Paint the picture and cut every piece into its own little canvas (with its shadow baked in). Once per round. */
function buildArt(g) {

  for (let r = 0; r < g.rows; r++) { cut.h.push([]); cut.v.push([]); for (let c = 0; c < g.cols; c++) { cut.h[r].push(R() < 0.5 ? 1 : -1); cut.v[r].push(R() < 0.5 ? 1 : -1); } }

    x.save(); x.clip(path); x.drawImage(picture, M - c * P, M - r * P); x.restore();
    x.lineWidth = 2; x.strokeStyle = "#0000004d"; x.stroke(path); x.translate(-0.8, -0.8); x.strokeStyle = "#ffffff40"; x.stroke(path);

// ── TABLE (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, pieces: null, held: {}, round: -1, dirty: false, heldDirty: false, lastWrite: 0, z: 0, bots: new Map(), lastBots: 0, botsJson: "", lastSync: 0 };
/** The round as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = shared("game", null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const N = () => CONFIG.cols * CONFIG.rows;
/** Pieces as everyone sees them: [{ x, y, z, p }] (x, y = top-left in piece-units, p = placed). */
function piecesNow(g) {

    ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; const w = ctx.measureText(c.name).width + 10;
    ctx.fillStyle = c.color; rr(12, 18, w, 18, 5); ctx.fill(); ctx.fillStyle = "#1b1209"; ctx.fillText(c.name, 17, 31);
    ctx.restore();
  }
  for (const [id, v] of cursors) if (v.seen !== now) cursors.delete(id);
}
/** Sparkles when a piece snaps in (seen by everyone, from the change in state). */
function effects(g, list) {
  if (g.id !== lastRound) { lastRound = g.id; lastPlaced = list.map((p) => p.p); return; }
  list.forEach((p, i) => { if (p.p && lastPlaced && !lastPlaced[i]) { for (let k = 0; k < 14; k++) sparks.push({ x: p.x + 0.5, y: p.y + 0.5, vx: rnd(-2.5, 2.5), vy: rnd(-2.5, 2.5), life: rnd(0.4, 0.8), color: k % 2 ? "#ffd98a" : "#fff", s: 0.06 }); if (!me.drop || me.drop.i !== i) sfx("snap", 0.5); } });
  lastPlaced = list.map((p) => p.p);
}

// ── HUD & CARD ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}`;
let board = null, toastTimer = 0, seenPhase = "";
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1800); }
function hud(g, list) {
  if (ATTRACT) return;
  const placed = list.filter((p) => p.p).length;
  $("stats").innerHTML = `Jigsaw Jam <small>${placed}/${list.length} placed · ${fmt(g.phase === "done" ? g.doneMs : g.startAt ? Date.now() - g.startAt : 0)}</small>`;
  const rows = Object.entries(g.tally || {}).map(([id, [n, name, color]]) => ({ n, name: id === net.sessionId ? "You" : name, color })).sort((a, b) => b.n - a.n).slice(0, 6);
  $("who").innerHTML = rows.map((r) => `<div><span style="color:${esc(r.color)}">${esc(r.name)}</span><i>${r.n}</i></div>`).join("");
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the table" : ""}`;
  $("hint").style.opacity = placed < 3 && g.phase === "play" ? 1 : 0;
  $("hint").textContent = "Drag pieces into the frame: they snap in when close. A piece in your hand is yours until you let go.";
  const key = g.id + g.phase;
  if (key !== seenPhase) {
    seenPhase = key;
    if (g.phase === "play") { $("over").hidden = true; me.played = g.id; }
    if (g.phase === "done") showDone(g);
  }
}
function showDone(g) {
  for (let k = 0; k < 120; k++) sparks.push({ x: g.cols / 2, y: g.rows / 2, vx: rnd(-7, 7), vy: rnd(-8, 3), life: rnd(1.2, 2.2), color: COLORS[k % COLORS.length], s: 0.1, fall: true });
  sfx("done");
  if (ATTRACT) return;
  setTimeout(() => { if (game()?.phase === "done") $("over").hidden = false; }, 1600); // admire the picture first
  const mine = (g.tally || {})[net.sessionId];
  $("doneText").textContent = `${g.cols * g.rows} pieces in ${fmt(g.doneMs)}${mine ? ` · you placed ${mine[0]}` : ""}`;
  const list = $("board");
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  const submit = me.played === g.id && me.submitted !== g.id ? board.submit(Math.max(0, 3600000 - g.doneMs)).catch(() => null) : Promise.resolve();
  me.submitted = g.id; list.innerHTML = "<li class='note'>Loading…</li>";
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(3600000 - e.score)}</span></li>`).join("") : "<li class='note'>No puzzles yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "done") return; if (isHost()) newRound(g.id + 1); else net.send("again", {}); };
let audio = null;
function sfx(kind, vol = 1) {
  if (!audio) return;
  try {
    const t = audio.currentTime, tone = (f, d, type, v, f2, at = 0) => { const o = audio.createOscillator(), gn = audio.createGain(); o.type = type; o.frequency.setValueAtTime(f, t + at); o.frequency.exponentialRampToValueAtTime(f2, t + at + d); gn.gain.setValueAtTime(v * vol, t + at); gn.gain.exponentialRampToValueAtTime(0.0001, t + at + d); o.connect(gn).connect(audio.destination); o.start(t + at); o.stop(t + at + d + 0.02); };
    if (kind === "pick") tone(420, 0.06, "triangle", 0.05, 560);
    if (kind === "drop") tone(260, 0.07, "triangle", 0.05, 180);
    if (kind === "snap") { tone(180, 0.05, "square", 0.05, 120); tone(880, 0.12, "triangle", 0.06, 1320, 0.03); }
    if (kind === "done") [523, 659, 784, 1046, 1318].forEach((f, k) => tone(f, 0.22, "triangle", 0.07, f, k * 0.1));
  } catch {}
}
const takenColors = () => new Set([...livePlayers().filter((id) => id !== net.sessionId).map((id) => S.entities.players[id]?.c), ...shared("bots", []).map((b) => b.c)]);
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. Bots' colors count too. */
function fixColor() {
  const others = livePlayers().filter((id) => id !== net.sessionId), botColors = isHost() ? [...host.bots.values()].map((b) => b.color) : shared("bots", []).map((b) => b.c);
  if (!others.some((id) => S.entities.players[id]?.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map((id) => S.entities.players[id]?.c), ...botColors]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const wake = () => { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const pointers = new Map(); // pointerId -> { x, y }
let pinch = null, pan = null;
/** The topmost loose piece under a point (its square, tabs ignored). */
function pieceAt(g, wx, wy) {
  const list = piecePositions(g, 0), held = heldNow(g); let best = -1;
  list.forEach((p, i) => { if (!p.p && wx >= p.x && wx <= p.x + 1 && wy >= p.y && wy <= p.y + 1 && (best < 0 || p.z > list[best].z)) best = i; });
  if (best >= 0 && held[best] && held[best] !== net.sessionId) { toast(`${nameOf(held[best])} is holding that one`); return -1; }
  return best;
}
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); wake(); if (e.button !== 0) return; // right/middle click: nothing
  try { cv.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  [me.cx, me.cy] = toWorld(e.clientX, e.clientY);
  const g = game(); if (!g) return;
  if (pointers.size === 2) { drop(); pan = null; const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; return; }
  const i = g.phase === "play" ? pieceAt(g, me.cx, me.cy) : -1;
  if (i >= 0) grab(i, me.cx, me.cy); else pan = { x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId), dx = p ? e.clientX - p.x : 0, dy = p ? e.clientY - p.y : 0;
  if (p) { p.x = e.clientX; p.y = e.clientY; }
  if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; zoomAt((pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / cam.z, (a.x + b.x) / 2, (a.y + b.y) / 2); cam.x -= dx / 2 / cam.z; cam.y -= dy / 2 / cam.z; return; }
  if (pan && p) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; cam.user = true; }
  if (e.pointerType === "mouse" || p) [me.cx, me.cy] = toWorld(e.clientX, e.clientY);
});
function release(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { pinch = null; pan = null; drop(); }
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // right-click: no browser menu
addEventListener("blur", () => { pointers.clear(); pinch = null; pan = null; drop(); }); // switching tabs mid-drag: let go of the piece
cv.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY); }, { passive: false });
addEventListener("keydown", (e) => { if (e.key === "+" || e.key === "=") zoomAt(1.25, W / 2, midY()); if (e.key === "-") zoomAt(0.8, W / 2, midY()); if (e.key === "0") cam.user = false; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the table meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(g, now);
    const list = piecePositions(g, dt);
    effects(g, list);
    draw(g, list, dt, now);
    if (now - lastHud > 150) { lastHud = now; hud(g, list); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("grab", (msg, from) => { if (isHost()) applyGrab(from, msg); });
  net.on("drop", (msg, from) => { if (isHost()) applyDrop(from, msg); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "done") newRound(g.id + 1); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { for (const id of ["stats", "who", "net", "hint"]) $(id).style.display = "none"; Object.assign(CONFIG, { seats: 4, botThinkMs: [100, 350], botMiss: 0.12, doneFor: 4000 }); }
  requestAnimationFrame(frame);
})();
</script>
